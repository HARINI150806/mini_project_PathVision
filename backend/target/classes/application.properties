# Logging configuration
logging.level.root=INFO
logging.level.com.pathvision=DEBUG
logging.console.enabled=true
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
spring.application.name=PathVision

# Database Configuration (Update with your credentials)
spring.datasource.url=jdbc:mysql://localhost:3306/pathvision_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1256harini..
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8080

# AI Integration Placeholders
app.ai.api-key=${GEMINI_API_KEY}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
# Replace the secret below with a secure Base64-encoded 256-bit key for production
jwt.secret=dGhpc2lzYXZlcnlzZWNyZXRrZXlmb3Jqd3RzaWduaW5nMTIzNDU2
jwt.expiration-ms=3600000

# File uploads
app.upload.dir=uploads

gemini.api.key=${GEMINI_API_KEY}
# Allow larger file uploads (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Dynamic learning resource sync (YouTube API)
app.resource-sync.enabled=true
app.resource-sync.initial-delay-ms=20000
app.resource-sync.fixed-delay-ms=21600000
app.resource-sync.youtube.api-key=${YOUTUBE_API_KEY:}
app.resource-sync.youtube.max-results=5
app.resource-sync.external.enabled=true
app.resource-sync.external.csv-url=${RESOURCE_FEED_CSV_URL:}
app.resource-sync.external.json-url=${RESOURCE_FEED_JSON_URL:}
app.resource-sync.external.default-source=Course
app.resource-sync.external.default-level=Beginner
app.resource-sync.external.default-interest-key=engineering_cse_it
app.resource-sync.nptel.enabled=true
app.resource-sync.nptel.catalog-url=https://nptel.ac.in/courses
app.resource-sync.nptel.max-items=30
app.resource-sync.coursera.enabled=true
app.resource-sync.coursera.catalog-url=https://www.coursera.org/browse/computer-science
app.resource-sync.coursera.max-items=30
